{% extends "base.html" %}

{% block title %}PC Parts{% endblock %}

{% block body %}
<main class="home-page">
    <section class="home-panel">
        <div class="home-brand">
            <p class="home-kicker">PC PARTS</p>
            <h1>PC 부품 가격 비교</h1>
            <p>
                컴퓨존과 다나와에서 수집한 PC 부품을
                카테고리별로 검색하고 가격을 비교합니다.
            </p>
        </div>

        <form
            class="home-search"
            method="get"
            action="{{ url_for('product_list') }}"
        >
            <input
                type="search"
                name="q"
                placeholder="제품명, 모델명, 브랜드 검색"
            >
            <button type="submit">검색</button>
        </form>

        <nav class="home-categories">
            {% for category in categories %}
                <a
                    href="{{ url_for(
                        'product_list',
                        category=category.category_code
                    ) }}"
                >
                    {{ category.category_name }}
                </a>
            {% endfor %}
        </nav>
    </section>
</main>
{% endblock %}
